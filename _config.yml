# Jekyll configuration for GitHub Pages with Just the Docs

title: 資安威脅情報中心
description: 自動化資安情報收集與分析系統
baseurl: ""
url: "https://security.weiqi.kids"

# Theme
theme: just-the-docs

# Logo and favicon
# logo: "/assets/images/logo.png"

# Footer
footer_content: "Copyright &copy; 2026 資安威脅情報中心. Powered by <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a>."

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: case_sensitive

# Heading anchor links
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "回到頂端"

# Defaults for pages - exclude all content from nav, only index.md files have nav
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: default
      nav_exclude: true
      search_exclude: false
  # SEO-optimized layout for Narrator reports
  - scope:
      path: "docs/Narrator"
      type: "pages"
    values:
      layout: seo-report
      seo_json: true

# Exclude from processing
exclude:
  - .env
  - .gitignore
  - CLAUDE.md
  - core/
  - lib/
  - scripts/
  - "*.sh"
  - "*.jsonl"
  - "*.xml"
  - raw/
  - node_modules/
  - vendor/
  - Gemfile.lock
  # threat_feeds 單筆 IoC 資料不需要產生網頁（資料量過大）
  - docs/Extractor/threat_feeds/malicious_url/20*.md
  - docs/Extractor/threat_feeds/malware_sample/20*.md
  - docs/Extractor/threat_feeds/c2_infrastructure/20*.md
  - docs/Extractor/threat_feeds/ioc_indicator/20*.md

# Include for processing
include:
  - docs/
  - "*.seo.json"

# Keep .seo.json files as static assets
keep_files:
  - "*.seo.json"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Permalinks - use pretty URLs (trailing slash)
permalink: pretty

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Timezone
timezone: Asia/Taipei
