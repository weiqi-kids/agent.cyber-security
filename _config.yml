# Jekyll configuration for GitHub Pages with Just the Docs

title: 資安威脅情報中心
description: 自動化資安情報收集與分析系統
baseurl: "/agent.cyber-security"
url: "https://weiqi-kids.github.io"

# Theme
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark

# Logo and favicon
# logo: "/assets/images/logo.png"

# Footer
footer_content: "Copyright &copy; 2026 資安威脅情報中心. Powered by <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a>."

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: case_sensitive

# Heading anchor links
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "回到頂端"

# External navigation links
nav_external_links:
  - title: GitHub
    url: https://github.com/weiqi-kids/agent.cyber-security

# Defaults for pages
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: default
  - scope:
      path: "docs/Extractor"
      type: "pages"
    values:
      layout: default
      grand_parent: Extractor
  - scope:
      path: "docs/Narrator"
      type: "pages"
    values:
      layout: default
      grand_parent: Narrator

# Exclude from processing
exclude:
  - .env
  - .gitignore
  - CLAUDE.md
  - core/
  - lib/
  - scripts/
  - "*.sh"
  - "*.jsonl"
  - "*.xml"
  - raw/
  - node_modules/
  - vendor/
  - Gemfile.lock

# Include for processing
include:
  - docs/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Timezone
timezone: Asia/Taipei
